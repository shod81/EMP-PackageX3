[project]
name = "emp-packagex3"
version = "1.1.0"
description = "EMP-PackageX3 – Matrix42 Empirum PackageCreator & PackageEditor"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [
  { name = "Stefan Hodrius", email = "310079184+shod81@users.noreply.github.com" },
]
keywords = ["empirum", "matrix42", "setup.inf", "packaging"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Installation/Setup",
  "Topic :: System :: Software Distribution",
]
dependencies = [
  "comtypes>=1.4.17",
  "pefile>=2024.8.26",
  "PySide6>=6.7",
]

[project.urls]
Homepage = "https://github.com/shod81/EMP-PackageX3"
Issues = "https://github.com/shod81/EMP-PackageX3/issues"
Security = "https://github.com/shod81/EMP-PackageX3/security/advisories/new"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.7",
  "mypy>=1.13",
]

[project.scripts]
emp-packagex3 = "emp_packagex3.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/emp_packagex3",
  "src/empirum_core",
  "src/empirum_services",
  "src/empirum_infra",
]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "testdata",
  "docs",
  "scripts",
  "README.md",
  "LICENSE",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "CODE_OF_CONDUCT.md",
  "THIRD_PARTY_LICENSES.md",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Setup.inf template/test literals and the help-text catalogue are intentionally
# long single lines (German prose that must stay contiguous in the UI).
[tool.ruff.lint.per-file-ignores]
"src/empirum_core/templates/__init__.py" = ["E501"]
"src/emp_packagex3/learning_content.py" = ["E501"]
"tests/unit/test_quoting_values.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["empirum_core", "empirum_services", "empirum_infra", "emp_packagex3"]

[[tool.mypy.overrides]]
module = ["PySide6.*", "pefile", "comtypes", "comtypes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# All four packages are measured. Per-package floors are enforced by
# scripts/check_coverage_gates.py (CI); the aggregate floor here is only a fast
# local safety net and must stay below the sum of the per-package floors.
addopts = "-q --cov=empirum_core --cov=emp_packagex3 --cov=empirum_services --cov=empirum_infra --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
branch = true
source = ["empirum_core", "emp_packagex3", "empirum_services", "empirum_infra"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
